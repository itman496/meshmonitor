name: Build and test MeshCore DM history fix

on:
  push:
    branches:
      - fix/meshcore-dm-history-pagination
    paths:
      - tools/apply_meshcore_dm_history_fix.py
      - tools/fix_meshcore_dm_history_builder_output.py
      - tools/fix_meshcore_dm_history_lint.py
      - .github/workflows/build-meshcore-dm-history-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Apply guarded source and test changes
        run: |
          python3 tools/apply_meshcore_dm_history_fix.py
          python3 tools/fix_meshcore_dm_history_builder_output.py
          python3 tools/fix_meshcore_dm_history_lint.py

      - name: Normalize generated test whitespace
        run: sed -i 's/[[:blank:]]\+$//' src/server/routes/meshcoreRoutes.test.ts

      - name: Check patch whitespace
        run: git diff --check

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run repository regression tests
        id: repo_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx vitest run src/db/repositories/meshcore.conversationHistory.test.ts 2>&1 | tee repository-tests.log

      - name: Run API route regression tests
        id: route_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx vitest run src/server/routes/meshcoreRoutes.test.ts 2>&1 | tee route-tests.log

      - name: Run DM component regression tests
        id: component_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx vitest run src/components/MeshCore/MeshCoreDirectMessagesView.test.tsx 2>&1 | tee component-tests.log

      - name: Upload focused test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-test-logs-${{ github.run_id }}
          path: |
            repository-tests.log
            route-tests.log
            component-tests.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce focused regression test results
        if: always()
        shell: bash
        run: |
          echo "repository=${{ steps.repo_tests.outcome }}"
          echo "routes=${{ steps.route_tests.outcome }}"
          echo "component=${{ steps.component_tests.outcome }}"
          test "${{ steps.repo_tests.outcome }}" = success
          test "${{ steps.route_tests.outcome }}" = success
          test "${{ steps.component_tests.outcome }}" = success

      - name: Run lint ratchet
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint:ci 2>&1 | tee lint.log

      - name: Upload lint log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-log-${{ github.run_id }}
          path: lint.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce lint result
        if: always()
        shell: bash
        run: |
          echo "lint=${{ steps.lint.outcome }}"
          test "${{ steps.lint.outcome }}" = success

      - name: Type-check production code
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Build server
        run: npm run build:server

      - name: Commit the tested implementation
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          rm tools/apply_meshcore_dm_history_fix.py
          rm tools/fix_meshcore_dm_history_builder_output.py
          rm tools/fix_meshcore_dm_history_lint.py
          rm .github/workflows/build-meshcore-dm-history-fix.yml
          git restore package-lock.json
          git diff --check
          git config user.name "itman496"
          git config user.email "1369216+itman496@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "fix(meshcore): paginate direct message history"
          git push origin "HEAD:${BRANCH_NAME}"
